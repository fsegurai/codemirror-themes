<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <form id="controls" class="toolbar">
      <label class="check"><input id="enabled" type="checkbox" checked /> Apply overrides</label>
      <label for="font-size">Font size</label>
      <input id="font-size" type="range" min="12" max="22" step="1" value="16" aria-describedby="font-size-value" />
      <output id="font-size-value" for="font-size"></output>
      <label for="line-height">Line height</label>
      <input id="line-height" type="range" min="1.2" max="2" step="0.1" value="1.8" aria-describedby="line-height-value" />
      <output id="line-height-value" for="line-height"></output>
      <label for="selection">Selection</label>
      <input id="selection" type="color" />
    </form>
    <div id="editor" class="frame"></div>
    <p class="hint">The code that produces the overrides:</p>
    <pre><code id="code"></code></pre>
  </body>
</html>
