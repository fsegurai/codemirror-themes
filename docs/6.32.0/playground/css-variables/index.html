<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <form id="tokens" class="toolbar">
      <fieldset id="colors">
        <legend>Page tokens (--cm-*)</legend>
      </fieldset>
      <label class="check"><input id="dark" type="checkbox" /> Dark page</label>
      <button id="reset" type="button">Reset</button>
    </form>
    <div id="editor" class="frame"></div>
    <details>
      <summary>Variables the theme reads (<span id="count"></span>)</summary>
      <pre><code id="names"></code></pre>
    </details>
  </body>
</html>
