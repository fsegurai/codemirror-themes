# Health check: package build, lint, tests and `bun audit` on main, plus the package and theme counts and the CodeMirror
# versions in use. The report goes to the job summary, an artifact and (except on manual runs) a comment on the open
# issue labelled `health-check`, if there is one. Build and lint failures fail the run; test failures and audit
# advisories are reported only.
# Triggers: weekly (Monday 03:00 UTC), pushes to main that change package sources or the workspace configuration, and on
# demand.
# Azure DevOps is the source repository: its build pipeline (`pipelines/.ado/build-pipeline.yml`, MIRROR stage) pushes
# main to this public GitHub mirror, so a merge on GitHub is overwritten by the next push; changes are applied in Azure
# DevOps.
name: Health check

on:
  schedule:
    - cron: '0 3 * * 1'
  push:
    branches: [main]
    paths:
      - 'packages/*/src/**'
      - 'packages/.helper/**'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

# Explicit bash runs every step with `-eo pipefail`, so a failing command fails its step even when piped.
defaults:
  run:
    shell: bash

jobs:
  health-check:
    name: Project health check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write # comments the report on the open `health-check` issue
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ vars.BUN_VERSION || '1.4.3' }}

      # --ignore-scripts skips the Husky `prepare` hook; no step below needs a lifecycle script.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Each check keeps its log and outcome for the report; pipefail makes a failing command fail its step.
      - name: Build packages
        id: build
        continue-on-error: true
        run: bun run build:packages 2>&1 | tee build.log

      - name: Lint
        id: lint
        continue-on-error: true
        run: bun run lint 2>&1 | tee lint.log

      - name: Tests
        id: test
        continue-on-error: true
        run: bun run test 2>&1 | tee test.log

      - name: Dependency audit
        id: audit
        continue-on-error: true
        run: bun audit 2>&1 | tee audit.log

      - name: Package inventory
        if: ${{ !cancelled() }}
        run: |
          # Theme package = packages/<name>/package.json, except bundle, core and dot-directories (such as .helper).
          packages=$(find packages -mindepth 2 -maxdepth 2 -name package.json ! -path "packages/.*" | wc -l)
          themes=$(find packages -mindepth 2 -maxdepth 2 -name package.json ! -path "packages/.*" \
            ! -path "packages/bundle/*" ! -path "packages/core/*" | wc -l)
          {
            echo "| Packages | ${packages} (${themes} themes) |"
            for dep in codemirror @codemirror/state @codemirror/language @codemirror/view @lezer/highlight; do
              # shellcheck disable=SC2016 # $dep is a jq variable, not a shell one
              query='.dependencies[$dep] // .devDependencies[$dep] // "not found"'
              version=$(jq -r --arg dep "$dep" "$query" package.json)
              echo "| ${dep} | ${version} |"
            done
          } > inventory.md

      - name: Generate health report
        if: ${{ !cancelled() }}
        env:
          BUILD: ${{ steps.build.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TEST: ${{ steps.test.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
        run: |
          state() { case "$1" in success) echo "✅ $2" ;; failure) echo "$3" ;; *) echo "⏭️ ${1:-not run}" ;; esac; }
          log_tail() {
            echo '```'
            if [ -f "$1" ]; then tail -20 "$1"; else echo "No log available"; fi
            echo '```'
          }
          {
            echo "## Project health report"
            echo ""
            echo "**Generated:** $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Build | $(state "$BUILD" 'Healthy' '❌ Failed') |"
            echo "| Lint | $(state "$LINT" 'Healthy' '❌ Failed') |"
            echo "| Tests | $(state "$TEST" 'Passing' '⚠️ Failures (reported)') |"
            echo "| Audit | $(state "$AUDIT" 'No advisories' '⚠️ Advisories (reported)') |"
            if [ -f inventory.md ]; then cat inventory.md; fi
            for log in build lint test audit; do
              echo ""
              echo "### ${log} log (last 20 lines)"
              log_tail "${log}.log"
            done
          } > health-report.md
          cat health-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload health report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: health-report
          path: |
            health-report.md
            *.log
          if-no-files-found: ignore
          retention-days: 90

      - name: Comment on the open health-check issue
        if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            if (!fs.existsSync('health-report.md')) {
              core.info('Health report not found, skipping the issue comment.');
              return;
            }
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'health-check',
              state: 'open',
              per_page: 1,
            });
            if (issues.length === 0) {
              core.info('No open health-check issue.');
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issues[0].number,
              body: `## Updated health check\n\n${fs.readFileSync('health-report.md', 'utf8')}`,
            });

      - name: Fail on build or lint errors
        if: steps.build.outcome == 'failure' || steps.lint.outcome == 'failure'
        run: |
          echo "::error::Build or lint failed. See the job summary and the health-report artifact."
          exit 1
