# Security scan: CodeQL (JavaScript/TypeScript, results in the Security tab) and a `bun audit` reported in the job
# summary, never a failure.
# Triggers: pushes and pull requests to main, weekly (Monday 02:00 UTC), and on demand.
# Azure DevOps is the source repository: its build pipeline (`pipelines/.ado/build-pipeline.yml`, MIRROR stage) pushes
# main to this public GitHub mirror, so a merge on GitHub is overwritten by the next push; changes are applied in Azure
# DevOps. Trivy runs in the Node.js template's security stage of the ADO PR pipeline (`pipelines/.ado/pr-pipeline.yml`,
# `security: true`), so its GitHub action is left out here.
# The mirror is public, so CodeQL needs no GitHub Advanced Security licence and is not gated by a variable.
name: Security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Explicit bash runs every step with `-eo pipefail`, so a failing command fails its step even when piped.
defaults:
  run:
    shell: bash

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read # CodeQL reads the workflow run metadata
      contents: read
      security-events: write # uploads the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # JavaScript/TypeScript is analyzed from source; no build is needed.
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ vars.BUN_VERSION || '1.4.3' }}

      # --ignore-scripts skips the Husky `prepare` hook; no step below needs a lifecycle script.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Bun audit (reported, not failing)
        run: |
          status=0
          bun audit > audit.txt 2>&1 || status=$?
          cat audit.txt
          {
            echo "## Bun audit"
            echo ""
            if [ "$status" -eq 0 ]; then
              echo "No advisories."
            else
              echo "Advisories found (exit code $status): reported, not a failure. Fixes are applied in Azure DevOps."
            fi
            echo ""
            echo '```'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
