# Checks: TypeScript and Biome checks, then the package build with a bundle export check.
# Triggers: pull requests to main (except Markdown and `docs/` only changes), and on demand. Tests run in `test.yml`.
# Azure DevOps is the source repository: its build pipeline (`pipelines/.ado/build-pipeline.yml`, MIRROR stage) pushes
# main to this public GitHub mirror, so a merge on GitHub is overwritten by the next push; changes are applied in Azure
# DevOps. The ADO PR pipeline (`pipelines/.ado/pr-pipeline.yml`) builds and runs `lint` and `format:audit`; this
# workflow adds the type check and the bundle export check.
name: Checks

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Explicit bash runs every step with `-eo pipefail`, so a failing command fails its step even when piped.
defaults:
  run:
    shell: bash

jobs:
  quick-checks:
    name: Quick validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ vars.BUN_VERSION || '1.4.3' }}

      # --ignore-scripts skips the Husky `prepare` hook; no step below needs a lifecycle script.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: TypeScript check
        run: bun run -- tsc --noEmit

      - name: Biome check
        run: bun run lint:check

      - name: Hint on failure
        if: failure()
        run: echo "Run \`bun run lint:fix\` locally to fix lint and formatting issues." >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ vars.BUN_VERSION || '1.4.3' }}

      # --ignore-scripts skips the Husky `prepare` hook; no step below needs a lifecycle script.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build packages
        run: bun run build:packages

      - name: Validate bundle exports
        run: |
          # Every workspace package except the bundle itself is exported by the bundle.
          status=0
          for pkg in packages/*/; do
            name=$(basename "$pkg")
            if [ "$name" = "bundle" ] || [ ! -f "${pkg}package.json" ]; then
              continue
            fi
            pkg_name=$(jq -r .name "${pkg}package.json")
            if grep -q "$pkg_name" packages/bundle/src/index.ts; then
              echo "  ✓ $pkg_name"
            else
              echo "::error file=packages/bundle/src/index.ts::Missing export for $pkg_name"
              status=1
            fi
          done
          exit "$status"

  validation-summary:
    name: Validation summary
    if: always()
    needs: [quick-checks, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report validation status
        env:
          QUICK_CHECKS: ${{ needs.quick-checks.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          icon() { if [ "$1" = "success" ]; then echo '✅'; else echo "❌ ($1)"; fi; }
          {
            echo "## Checks summary"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Quick validation (types, Biome) | $(icon "$QUICK_CHECKS") |"
            echo "| Build integration (package build, bundle exports) | $(icon "$BUILD") |"
          } >> "$GITHUB_STEP_SUMMARY"
