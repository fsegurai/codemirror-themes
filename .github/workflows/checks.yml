name: PR Validation

on:
  pull_request:
    branches: ['main']
    # Path filters are evaluated in order and the last matching pattern wins.
    # Documentation and configuration-only changes are skipped; workflow changes always run.
    paths:
      - '**'
      - '!**/*.md'
      - '!**/*.yml'
      - '!**/*.yaml'
      - '!**/*.config'
      - '!.github/**'
      - '.github/workflows/*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  quick-checks:
    name: Quick Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: TypeScript strict check
        run: bun run -- tsc --noEmit

      - name: Lint check (fail on warnings)
        run: bun run lint:check

      - name: Run tests
        run: bun run test

      - name: Type-check tests
        run: bun run test:types

  pr_integration:
    name: Build Integration Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build packages (quick validation)
        run: |
          echo "Building packages to validate compilation..."
          # bash runs with -o pipefail, so a failing build fails this step despite the tail.
          bun run build:packages 2>&1 | tail -20
          echo "✅ Build successful"

      - name: Validate bundle exports
        run: |
          echo "Validating all themes are exported in bundle..."
          error=0
          for pkg in packages/*/; do
            name=$(basename "$pkg")
            if [ "$name" = "bundle" ] || [ "$name" = ".helper" ]; then
              continue
            fi
            pkg_json="${pkg}package.json"
            if [ -f "$pkg_json" ]; then
              pkg_name=$(jq -r .name "$pkg_json")
              if ! grep -q "$pkg_name" packages/bundle/src/index.ts; then
                echo "❌ Missing export for $pkg_name in packages/bundle/src/index.ts"
                error=1
              else
                echo "  ✓ $pkg_name"
              fi
            fi
          done
          if [ "$error" -eq 0 ]; then
            echo "✅ All themes exported in bundle"
          else
            exit 1
          fi

  validation-summary:
    name: Validation Summary
    if: always()
    needs: [quick-checks, pr_integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report validation status
        env:
          QUICK_CHECKS: ${{ needs.quick-checks.result }}
          BUILD_INTEGRATION: ${{ needs.pr_integration.result }}
        run: |
          icon() { [ "$1" = "success" ] && echo '✅' || echo "⚠️ ($1)"; }
          {
            echo "## PR Validation Summary"
            echo ""
            echo "- Quick Checks (types, lint, tests): $(icon "$QUICK_CHECKS")"
            echo "- Build Integration: $(icon "$BUILD_INTEGRATION")"
            echo ""
            echo "💡 Release builds run in Azure DevOps Pipelines"
          } | tee -a "$GITHUB_STEP_SUMMARY"
