name: Dependency Audit

on:
  schedule:
    # Run weekly on Wednesday at 4 AM UTC
    - cron: '0 4 * * 3'
  pull_request:
    paths:
      - 'package.json'
      - 'bun.lock'
      - 'packages/*/package.json'
      - '.github/workflows/dependency-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  audit:
    name: Dependency Health Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run security audit
        id: security
        run: |
          echo "Running security audit..."
          # bun audit exits non-zero when advisories at or above the audit level exist.
          AUDIT_STATUS=0
          bun audit --audit-level=high > audit-security.txt 2>&1 || AUDIT_STATUS=$?
          cat audit-security.txt

          if [ "$AUDIT_STATUS" -ne 0 ]; then
            echo "SECURITY_ISSUES=true" >> "$GITHUB_ENV"
          else
            echo "SECURITY_ISSUES=false" >> "$GITHUB_ENV"
          fi

      - name: Check outdated packages
        id: outdated
        run: |
          echo "Checking for outdated packages..."

          # List all packages and their versions
          {
            echo "# Dependency Report"
            echo ""
            echo "## Root Dependencies"
            echo "\`\`\`"
            bun pm ls --depth=0
            echo "\`\`\`"
            echo ""
            echo "## Outdated Packages (all workspaces)"
            echo "\`\`\`"
          } > outdated-report.txt

          bun outdated --recursive > outdated.txt 2>&1 || true
          cat outdated.txt >> outdated-report.txt
          echo "\`\`\`" >> outdated-report.txt

          # bun outdated prints a "| Package | Current | ..." table only when something is outdated.
          if grep -qE '^\|[[:space:]]*Package[[:space:]]*\|' outdated.txt; then
            echo "OUTDATED_ISSUES=true" >> "$GITHUB_ENV"
          else
            echo "OUTDATED_ISSUES=false" >> "$GITHUB_ENV"
          fi

      - name: Analyze dependency age
        id: age
        run: |
          {
            echo "## Dependency Age Analysis"
            echo ""
            echo "Last update timestamps for key dependencies:"
            echo "\`\`\`"

            # Check key dependencies
            for dep in "codemirror" "@codemirror/view" "@codemirror/state" "@lezer/highlight" "typescript" "@biomejs/biome"; do
              VERSION=$(npm view "$dep@latest" version 2>/dev/null || echo "unknown")
              INSTALLED=$(grep -oP "\"$dep\":\s*\"\K[^\"]+?" package.json | head -1 || true)
              echo "$dep: installed=$INSTALLED, latest=$VERSION"
            done

            echo "\`\`\`"
          } > age-report.txt

      - name: Generate audit comment
        id: comment
        run: |
          {
            echo "## 📦 Dependency Audit Report"
            echo ""
            echo "**Scan Date:** $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo ""

            if [ "${{ env.SECURITY_ISSUES }}" = "true" ]; then
              echo "### ⚠️ Security Issues Found"
              echo "\`\`\`"
              cat audit-security.txt
              echo "\`\`\`"
            else
              echo "### ✅ No Security Vulnerabilities"
            fi

            echo ""

            if [ "${{ env.OUTDATED_ISSUES }}" = "true" ]; then
              echo "### 🔄 Outdated Packages Detected"
              tail -20 outdated-report.txt
            else
              echo "### ✅ All Dependencies Current"
            fi

            echo ""
            cat age-report.txt
          } >> audit-comment.txt

      - name: Write audit summary
        run: cat audit-comment.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        # Fork PRs get a read-only token; they rely on the step summary above.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('audit-comment.txt', 'utf8');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            })

      - name: Upload audit reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-audit-reports
          path: |
            audit-security.txt
            outdated-report.txt
            age-report.txt
          retention-days: 30

      - name: Create issue if vulnerabilities found
        if: env.SECURITY_ISSUES == 'true' && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const audit = fs.readFileSync('audit-security.txt', 'utf8');

            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'security',
              state: 'open'
            });

            const existingIssue = issues.data.find(issue => 
              issue.title.includes('Dependency vulnerabilities')
            );

            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🔒 Dependency vulnerabilities detected',
                body: '## Security Audit Alert\n\nDependency vulnerabilities detected in scheduled audit.\n\n' + audit,
                labels: ['security', 'dependencies']
              });
            }

