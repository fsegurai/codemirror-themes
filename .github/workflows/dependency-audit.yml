# Dependency audit: `bun audit`, the installed root packages and `bun outdated` (all workspaces), reported in the job
# summary and an artifact, never a failure; a scheduled run with advisories opens one `security` issue (unless one is
# already open).
# Triggers: weekly (Wednesday 04:00 UTC), pull requests that change a `package.json` or `bun.lock`, and on demand.
# Azure DevOps is the source repository: its build pipeline (`pipelines/.ado/build-pipeline.yml`, MIRROR stage) pushes
# main to this public GitHub mirror, so a merge on GitHub is overwritten by the next push; changes are applied in Azure
# DevOps. Dependency updates are applied there (see `.github/dependabot.yml`).
name: Dependency audit

on:
  schedule:
    - cron: '0 4 * * 3'
  pull_request:
    paths:
      - 'package.json'
      - 'bun.lock'
      - 'packages/*/package.json'
      - '.github/workflows/dependency-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Explicit bash runs every step with `-eo pipefail`, so a failing command fails its step even when piped.
defaults:
  run:
    shell: bash

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write # the scheduled run opens a `security` issue when advisories are found
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ vars.BUN_VERSION || '1.4.3' }}

      # --ignore-scripts skips the Husky `prepare` hook; no step below needs a lifecycle script.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Bun audit
        id: audit
        run: |
          status=0
          bun audit > audit.txt 2>&1 || status=$?
          cat audit.txt
          if [ "$status" -ne 0 ]; then found=true; else found=false; fi
          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Installed and outdated packages
        run: |
          {
            echo "### Installed packages (root)"
            echo '```'
            bun pm ls
            echo '```'
            echo ""
            echo "### Outdated packages (all workspaces)"
            echo '```'
            # bun outdated exits non-zero when something is outdated; that is reported, not a failure.
            bun outdated --recursive 2>&1 || true
            echo '```'
          } > outdated.txt
          cat outdated.txt

      - name: Write the report
        if: ${{ !cancelled() }}
        env:
          FOUND: ${{ steps.audit.outputs.found }}
        run: |
          show() { if [ -f "$1" ]; then cat "$1"; else echo "Not run"; fi; }
          {
            echo "## Dependency audit report"
            echo ""
            echo "**Scan date:** $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo ""
            if [ "$FOUND" = "true" ]; then
              echo "### ⚠️ bun audit: advisories found"
            else
              echo "### ✅ bun audit: no advisories"
            fi
            echo '```'
            show audit.txt
            echo '```'
            echo ""
            show outdated.txt
            echo ""
            echo "_Dependency updates are applied in the Azure DevOps source repository (this is its mirror)._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit-reports
          path: |
            audit.txt
            outdated.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Open an issue for scheduled advisories
        if: steps.audit.outputs.found == 'true' && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const title = 'Dependency vulnerabilities detected';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'security',
              state: 'open',
              per_page: 100,
            });
            if (issues.some((issue) => issue.title.includes(title))) {
              core.info('An open dependency vulnerability issue already exists.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                '## Security audit',
                '',
                'The scheduled `bun audit` reported advisories. Apply the fix in the Azure DevOps source repository;',
                'the mirror push carries it to GitHub.',
                '',
                '```',
                fs.readFileSync('audit.txt', 'utf8'),
                '```',
              ].join('\n'),
              labels: ['security', 'dependencies'],
            });
