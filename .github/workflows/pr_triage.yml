name: "Pull Request Triage"

# Security: pull_request_target runs with a write token in the context of the base repository.
# This workflow must never check out, build or execute code from the pull request, and must never
# interpolate ${{ github.event.* }} values into run/script bodies (read them from context.payload).
on:
  pull_request_target:
    types: [opened, ready_for_review, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Grab the trusted base sources only to read .github/labeler.yml (never the PR head).
      - name: Fetch sources
        uses: actions/checkout@v7
        with:
          repository: fsegurai/codemirror-themes
          ref: main
          persist-credentials: false

      - name: Update labels based on changes
        uses: actions/labeler@v7
        with:
          sync-labels: true
          dot: true

      - name: Assign PR creator
        if: github.event.action != 'synchronize'
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const assignees = pr.assignees.map(assignee => assignee.login);
            const author = pr.user.login;

            if (assignees.includes(author)) {
              return;
            }

            if (pr.user.type === 'Bot') {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                reviewers: ['fsegurai']
              });
            } else {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                assignees: [author]
              });
            }

      - name: Add first-time contributor welcome
        if: github.event.action == 'opened'
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const firstTime = ['FIRST_TIME_CONTRIBUTOR', 'FIRST_TIMER'].includes(pr.author_association);

            if (!firstTime || pr.user.type === 'Bot') {
              return;
            }

            const docs = 'https://github.com/fsegurai/codemirror-themes/blob/main';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: '👋 **Welcome, @' + pr.user.login + '!**\n\nThank you for your contribution to codemirror-themes! Here\'s what to expect:\n\n- **Tests run automatically** - our CI pipeline validates linting, tests and builds\n- **Reviews** - a maintainer will review your changes\n- **Labels** - we auto-tag PRs to help organize discussions\n- **Questions?** - feel free to ask in the comments\n\n📚 **Helpful Resources:**\n- [Contributing Guide](' + docs + '/CONTRIBUTING.md)\n- [AGENTS Guide](' + docs + '/AGENTS.md) - Project architecture\n- [README](' + docs + '/README.md)\n\nWe appreciate your help! 🎉'
            });

      - name: Add Dependabot PR comment
        if: github.event.action != 'synchronize'
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;

            if (pr.user.type !== 'Bot' || !pr.user.login.startsWith('dependabot')) {
              return;
            }

            // Check if we already commented
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100
            });

            const hasDepbotComment = comments.some(c =>
              (c.body || '').includes('Dependabot Update')
            );

            if (!hasDepbotComment) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: '🤖 **Dependabot Update**\n\nThis is an automated dependency update. A few things to know:\n\n- **Bun workspace**: All dependencies are managed through the root `package.json`\n- **Build checks**: The PR build validates all packages can compile\n- **Security**: Our security scan pipeline reviews all updates\n- **Merge**: Maintainers will review and merge periodically\n\n💡 Tip: Use `@dependabot rebase` to update this PR if conflicts occur.'
              });
            }

      - name: Note modified themes in PR body
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });

            // Check if it's a theme-specific change
            const themeFiles = files.filter(f => f.filename.startsWith('packages/'));

            if (themeFiles.length > 0 && themeFiles.length <= 5) {
              const themes = new Set();
              themeFiles.forEach(f => {
                const match = f.filename.match(/packages\/([^/]+)\//);
                if (match) themes.add(match[1]);
              });

              if (themes.size > 0) {
                const note = `📦 **Theme(s) Modified:** ${Array.from(themes).join(', ')}`;
                const body = pr.body || '';

                // Add to PR body if not already there
                if (!body.includes(note)) {
                  await github.rest.pulls.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: pr.number,
                    body: body ? body + '\n\n' + note : note
                  });
                }
              }
            }
