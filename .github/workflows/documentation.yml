# Documentation: closed fenced code blocks and relative links in every tracked Markdown file, the README sections, the
# current docs version (`docs/<version>/manifest.json` and `manifest-generator --validate`) and the demo build (`bun run
# build:demo`). Results go to the job summary; nothing is deployed from here.
# Triggers: pull requests and pushes to main that change Markdown, `demo/` or `docs/`, and on demand.
# Azure DevOps is the source repository: its build pipeline (`pipelines/.ado/build-pipeline.yml`, MIRROR stage) pushes
# main to this public GitHub mirror, so a merge on GitHub is overwritten by the next push; changes are applied in Azure
# DevOps. The demo site is built and published by the ADO release pipeline.
name: Documentation

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'demo/**'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'
      - 'demo/**'
      - 'docs/**'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Explicit bash runs every step with `-eo pipefail`, so a failing command fails its step even when piped.
defaults:
  run:
    shell: bash

jobs:
  validate-markdown:
    name: Validate Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check fenced code blocks
        run: |
          # A fence opens with 3+ backticks or tildes (up to 3 spaces of indentation) and closes with the same character
          # repeated at least as many times and nothing else; a backtick fence whose info string holds a backtick is
          # inline code (CommonMark).
          status=0
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            if ! where=$(awk '
              match($0, /^ {0,3}(`{3,}|~{3,})/) {
                fence = substr($0, RSTART, RLENGTH); sub(/^ +/, "", fence)
                rest = substr($0, RSTART + RLENGTH)
                if (open == "") {
                  if (substr(fence, 1, 1) == "`" && index(rest, "`") > 0) next
                  open = fence; start = NR; next
                }
                same = substr(fence, 1, 1) == substr(open, 1, 1) && length(fence) >= length(open)
                if (same && rest ~ /^[ \t]*$/) open = ""
              }
              END { if (open != "") { printf "line %d", start; exit 1 } }
            ' "$file"); then
              echo "::error file=$file::Unclosed fenced code block (opened at $where)"
              status=1
            fi
          done < <(git ls-files '*.md')
          if [ "$status" -eq 0 ]; then echo "All fenced code blocks are closed."; fi
          exit "$status"

      - name: Check relative links
        run: |
          # Links resolve from each file's directory. URLs, anchors and site-root links (`/v1`, routes of the docs
          # site) are not checked; neither are fenced code blocks and inline code.
          status=0
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            dir=$(dirname "$file")
            while IFS= read -r link; do
              target=${link%%#*}
              target=${target%%\?*}
              target=${target#<}
              target=${target%>}
              case "$target" in ''|/*|http://*|https://*|mailto:*|tel:*|data:*) continue ;; esac
              if [ ! -e "$dir/$target" ]; then
                echo "::error file=$file::Broken relative link: $link"
                status=1
              fi
            done < <(awk '
              /^ {0,3}(```|~~~)/ { code = !code; next }
              !code { line = $0; gsub(/`[^`]*`/, "", line); print line }
            ' "$file" | grep -oE '\]\([^) ]+' | sed 's/^](//' || true)
          done < <(git ls-files '*.md')
          if [ "$status" -eq 0 ]; then echo "All relative links resolve."; fi
          exit "$status"

  validate-structure:
    name: Validate README structure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate main README
        env:
          # Repository-specific: the README headings to look for, and whether a missing one is an error or a warning.
          REQUIRED_SECTIONS: 'Installation|Using a Theme|Available Themes|Demo Application|License'
          MISSING_LEVEL: error
        run: |
          status=0
          IFS='|' read -r -a sections <<< "$REQUIRED_SECTIONS"
          for section in "${sections[@]}"; do
            # The heading may start with an emoji or another prefix ("## 📦 Installation").
            if ! grep -qE "^#{2,3} (.* )?${section}[[:space:]]*$" README.md; then
              echo "::${MISSING_LEVEL} file=README.md::Missing section: ${section}"
              if [ "$MISSING_LEVEL" = "error" ]; then status=1; fi
            fi
          done
          if [ "$status" -eq 0 ]; then echo "README structure checked."; fi
          exit "$status"

      - name: Validate package READMEs
        run: |
          for readme in packages/*/README.md; do
            if ! head -1 "$readme" | grep -q '^#'; then
              echo "::warning file=$readme::Missing title"
            fi
          done
          echo "Package READMEs checked."

  build-demo:
    name: Validate demo build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ vars.BUN_VERSION || '1.4.3' }}

      # --ignore-scripts skips the Husky `prepare` hook; no step below needs a lifecycle script.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate demo entry files
        run: |
          status=0
          for file in demo/index.html demo/playground.html demo/scripts/index.ts demo/scripts/playground.ts \
            demo/styles/app-theme.css; do
            if [ ! -f "$file" ]; then
              echo "::error file=$file::Missing demo entry file"
              status=1
            fi
          done
          exit "$status"

      - name: Validate the current docs version
        run: |
          VERSION=$(jq -r .version package.json)
          DOCS_DIR="./docs/${VERSION}"
          if [ ! -f "${DOCS_DIR}/manifest.json" ]; then
            echo "::error::Missing ${DOCS_DIR}/manifest.json (run: bun run generate:manifest)"
            exit 1
          fi
          bunx manifest-generator --validate --docs-root "${DOCS_DIR}/content"
          echo "Docs ${VERSION} are valid."

      - name: Build demo
        run: bun run build:demo

  summary:
    name: Documentation summary
    if: always()
    needs: [validate-markdown, validate-structure, build-demo]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write the summary
        env:
          MARKDOWN: ${{ needs.validate-markdown.result }}
          STRUCTURE: ${{ needs.validate-structure.result }}
          DEMO: ${{ needs.build-demo.result }}
        run: |
          icon() { if [ "$1" = "success" ]; then echo '✅'; else echo "❌ ($1)"; fi; }
          {
            echo "## Documentation report"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Markdown (fences, relative links) | $(icon "$MARKDOWN") |"
            echo "| README structure | $(icon "$STRUCTURE") |"
            echo "| Demo build (docs version, demo) | $(icon "$DEMO") |"
          } >> "$GITHUB_STEP_SUMMARY"
