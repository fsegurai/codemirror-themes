name: Documentation

on:
  push:
    branches: ['main']
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'AGENTS.md'
      - 'CHANGELOG.md'
      - 'demo/**'
      - 'docs/**'
      - 'packages/*/README.md'
      - '.github/workflows/documentation.yml'
  pull_request:
    branches: ['main']
    paths:
      - '**/*.md'
      - 'demo/**'
      - 'docs/**'
      - '.github/workflows/documentation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  validate-markdown:
    name: Validate Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check markdown syntax
        run: |
          # A fence opens with 3+ backticks or tildes (any indentation) and is closed only by
          # the same character repeated at least as many times with nothing else on the line.
          ERRORS=0
          while IFS= read -r file; do
            if ! where=$(awk '
              {
                line = $0
                sub(/^[ \t]+/, "", line)
                if (!open) {
                  if (match(line, /^(`{3,}|~{3,})/)) { open = 1; ch = substr(line, 1, 1); len = RLENGTH; start = NR }
                } else if (match(line, /^(`{3,}|~{3,})[ \t]*$/) && substr(line, 1, 1) == ch) {
                  n = line; sub(/[ \t]+$/, "", n)
                  if (length(n) >= len) open = 0
                }
              }
              END { if (open) { printf "line %d", start; exit 1 } }
            ' "$file"); then
              echo "❌ Unclosed code block in $file (opened at $where)"
              ERRORS=1
            fi
          done < <(find . -name '*.md' -type f -not -path '*/node_modules/*' -not -path '*/.*' -not -path '*/dist/*' | sort)
          if [ "$ERRORS" -ne 0 ]; then
            exit 1
          fi
          echo "✅ All markdown code blocks are closed"

      - name: Check for broken links in markdown
        run: |
          # Relative links resolve from each file's own directory; root-relative links ("/x") from the
          # repository root. External URLs, anchors, fenced code blocks and inline code are ignored.
          BROKEN=0
          while IFS= read -r file; do
            dir=$(dirname "$file")
            while IFS= read -r link; do
              target=${link%%#*}
              target=${target%% *}
              target=${target#<}
              target=${target%>}
              [ -z "$target" ] && continue
              case "$target" in
                http://*|https://*|mailto:*|tel:*|data:*) continue ;;
              esac
              if [[ $target == /* ]]; then resolved=".${target}"; else resolved="${dir}/${target}"; fi
              if [ ! -e "$resolved" ]; then
                echo "❌ Broken link in $file: $link"
                BROKEN=1
              fi
            done < <(awk '
              {
                line = $0
                sub(/^[ \t]+/, "", line)
                if (!open) {
                  if (match(line, /^(`{3,}|~{3,})/)) { open = 1; ch = substr(line, 1, 1); len = RLENGTH; next }
                } else {
                  if (match(line, /^(`{3,}|~{3,})[ \t]*$/) && substr(line, 1, 1) == ch) {
                    n = line; sub(/[ \t]+$/, "", n)
                    if (length(n) >= len) open = 0
                  }
                  next
                }
                gsub(/`[^`]*`/, "", line)
                while (match(line, /\]\([^)]+\)/)) {
                  print substr(line, RSTART + 2, RLENGTH - 3)
                  line = substr(line, RSTART + RLENGTH)
                }
              }
            ' "$file")
          done < <(find . -name '*.md' -type f -not -path '*/node_modules/*' -not -path '*/.*' -not -path '*/dist/*' | sort)
          if [ "$BROKEN" -ne 0 ]; then
            echo "Fix the broken relative links listed above."
            exit 1
          fi
          echo "✅ All relative links valid"

      - name: Report documentation issues
        if: failure()
        run: |
          {
            echo "## ⚠️ Documentation Issues Found"
            echo ""
            echo "Please fix markdown syntax and broken links. Check the workflow logs for details."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR if issues found
        # Fork PRs get a read-only token; they rely on the step summary above.
        if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ **Documentation Issues Found**\n\nPlease fix markdown syntax and broken links. Check the workflow logs for details.'
            });

  validate-structure:
    name: Validate README Structure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate main README
        run: |
          echo "Validating README.md structure..."
          # Must match the real headings of README.md.
          REQUIRED_SECTIONS=("Installation" "Using a Theme" "Available Themes" "Demo Application" "License")
          MISSING=0
          for section in "${REQUIRED_SECTIONS[@]}"; do
            if ! grep -Eq "^#{2,3} ${section}[[:space:]]*$" README.md; then
              echo "❌ Missing or incorrectly formatted section: $section"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            exit 1
          fi
          echo "✅ README structure validation complete"

      - name: Validate package READMEs
        run: |
          echo "Validating package README structure..."
          for readme in packages/*/README.md; do
            if [ -f "$readme" ]; then
              PKG=$(basename "$(dirname "$readme")")
              if ! head -1 "$readme" | grep -q "^#"; then
                echo "⚠️ $PKG/README.md: Missing title"
              fi
            fi
          done
          echo "✅ Package README validation complete"

  validate-docs-version:
    name: Validate Current Docs Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Validate docs for the current package version
        run: |
          VERSION=$(jq -r .version package.json)
          DOCS_DIR="./docs/${VERSION}"
          echo "Validating ${DOCS_DIR}..."
          if [ ! -f "${DOCS_DIR}/manifest.json" ]; then
            echo "❌ Missing ${DOCS_DIR}/manifest.json (run: bun run generate:manifest)"
            exit 1
          fi
          bunx manifest-generator --validate --docs-root "${DOCS_DIR}/content"
          echo "✅ Docs ${VERSION} are valid"

  build-demo-validation:
    name: Validate Demo Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Validate demo structure
        run: |
          echo "Validating demo application..."
          FILES=(
            "demo/index.html"
            "demo/playground.html"
            "demo/scripts/index.ts"
            "demo/scripts/playground.ts"
            "demo/styles/app-theme.css"
          )
          for file in "${FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file exists"
            else
              echo "❌ Missing critical file: $file"
              exit 1
            fi
          done

      - name: Build demo
        run: |
          echo "Building demo application..."
          # Keep the full log in a file: truncating a live pipe with head could kill the build early.
          bun run build:demo > demo-build.log 2>&1 || { tail -50 demo-build.log; exit 1; }
          head -50 demo-build.log
          echo "✅ Demo built successfully"

      - name: Report demo build
        run: |
          {
            echo "## 📚 Documentation Check Passed"
            echo ""
            echo "✅ All markdown validated"
            echo "✅ Links verified"
            echo "✅ Demo builds successfully"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '📚 **Documentation Check Passed**\n\n✅ All markdown validated\n✅ Links verified\n✅ Demo builds successfully'
            });

  generate-summary:
    name: Documentation Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [validate-markdown, validate-structure, validate-docs-version, build-demo-validation]
    steps:
      - name: Create documentation summary
        run: |
          {
            echo "## 📚 Documentation Report"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Markdown Syntax & Links | ${{ needs.validate-markdown.result == 'success' && '✅' || '❌' }} |"
            echo "| README Structure | ${{ needs.validate-structure.result == 'success' && '✅' || '❌' }} |"
            echo "| Docs Version | ${{ needs.validate-docs-version.result == 'success' && '✅' || '❌' }} |"
            echo "| Demo Build | ${{ needs.build-demo-validation.result == 'success' && '✅' || '❌' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
