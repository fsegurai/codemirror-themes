name: Performance Monitor

on:
  pull_request:
    branches: ['main']
    paths:
      - 'packages/*/src/**'
      - 'vite.config.ts'
      - '.github/workflows/perf-monitor.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  bundle-size:
    name: Monitor Bundle Sizes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.base_ref }}
          path: base

      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          path: pr

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build base branch
        working-directory: base
        run: |
          bun install
          bun run build:packages
          # One folder per package (packages/<name>/dist only, never nested node_modules dists).
          mkdir -p /tmp/base-dist
          for dist in packages/*/dist; do
            [ -d "$dist" ] || continue
            cp -r "$dist" "/tmp/base-dist/$(basename "$(dirname "$dist")")"
          done

      - name: Build PR branch
        working-directory: pr
        run: |
          bun install
          bun run build:packages
          # One folder per package (packages/<name>/dist only, never nested node_modules dists).
          mkdir -p /tmp/pr-dist
          for dist in packages/*/dist; do
            [ -d "$dist" ] || continue
            cp -r "$dist" "/tmp/pr-dist/$(basename "$(dirname "$dist")")"
          done

      - name: Calculate size differences
        id: sizes
        run: |
          size_of() { if [ -d "$1" ]; then du -sb "$1" | awk '{print $1}'; else echo 0; fi; }

          # Per-package comparison (bytes). Packages only present on one side show 0 on the other.
          {
            printf '%-24s %12s %12s %12s %8s\n' "Package" "Base" "PR" "Diff" "Change"
            for pkg in $( (ls /tmp/base-dist; ls /tmp/pr-dist) 2>/dev/null | sort -u); do
              base=$(size_of "/tmp/base-dist/$pkg")
              pr=$(size_of "/tmp/pr-dist/$pkg")
              diff=$((pr - base))
              if [ "$base" -gt 0 ]; then
                change=$(awk -v d="$diff" -v b="$base" 'BEGIN { printf "%+.1f%%", d * 100 / b }')
              else
                change="new"
              fi
              printf '%-24s %12s %12s %12s %8s\n' "$pkg" "$base" "$pr" "$diff" "$change"
            done
          } > /tmp/sizes.txt

          # Calculate total sizes
          BASE_SIZE=$(size_of /tmp/base-dist)
          PR_SIZE=$(size_of /tmp/pr-dist)

          if [ "$BASE_SIZE" -gt 0 ]; then
            DIFF=$((PR_SIZE - BASE_SIZE))
            # One decimal place; the regression check below compares it numerically.
            PERCENT=$(awk -v d="$DIFF" -v b="$BASE_SIZE" 'BEGIN { printf "%.1f", d * 100 / b }')

            {
              echo "BASE_SIZE=$BASE_SIZE"
              echo "PR_SIZE=$PR_SIZE"
              echo "DIFF=$DIFF"
              echo "PERCENT=$PERCENT"
            } >> "$GITHUB_ENV"
          fi

      - name: Format bundle report
        id: report
        run: |
          {
            echo "REPORT<<EOF"
            echo "## 📦 Bundle Size Analysis"
            echo ""
            echo "| Metric | Size |"
            echo "|--------|------|"

            if [ -n "${BASE_SIZE:-}" ] && [ "$BASE_SIZE" != "0" ]; then
              BASE_MB=$(echo "scale=2; $BASE_SIZE / 1024 / 1024" | bc)
              PR_MB=$(echo "scale=2; $PR_SIZE / 1024 / 1024" | bc)

              echo "| Base Branch | ${BASE_MB} MB |"
              echo "| PR Branch | ${PR_MB} MB |"

              DIFF_MB=$(echo "scale=2; $DIFF / 1024 / 1024" | bc)
              if [ "$DIFF" -gt 0 ]; then
                echo "| **Change** | **+${DIFF_MB} MB (${PERCENT}%)** ⚠️ |"
              elif [ "$DIFF" -lt 0 ]; then
                echo "| **Change** | **${DIFF_MB} MB (${PERCENT}%)** ✅ |"
              else
                echo "| **Change** | **No change** |"
              fi
            else
              echo "| Status | Unable to calculate (fresh build) |"
            fi

            echo ""
            echo "### Detailed Breakdown"
            echo "\`\`\`"
            cat /tmp/sizes.txt
            echo "\`\`\`"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Write bundle summary
        run: printf '%s\n' "$REPORT" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        # Fork PRs get a read-only token; they rely on the step summary above.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: process.env.REPORT
            })

      - name: Check for size regression
        if: env.PERCENT != ''
        run: |
          if awk -v p="$PERCENT" 'BEGIN { exit !(p > 10) }'; then
            echo "⚠️ Bundle size increased by more than 10% (${PERCENT}%)"
            exit 1
          fi
          echo "Bundle size change: ${PERCENT}%"

      - name: Save bundle report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bundle-size-report
          path: /tmp/sizes.txt
          retention-days: 30

