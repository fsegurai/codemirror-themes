# Performance monitor: builds the packages of the base branch and of the pull request (`bun run build:packages`), writes
# a per-package `packages/<name>/dist` size table to the job summary and an artifact, and fails when the total grows by
# more than 10%.
# Triggers: pull requests to main that change package sources or build configuration, and on demand (against the default
# branch).
# Azure DevOps is the source repository: its build pipeline (`pipelines/.ado/build-pipeline.yml`, MIRROR stage) pushes
# main to this public GitHub mirror, so a merge on GitHub is overwritten by the next push; changes are applied in Azure
# DevOps. The ADO pipelines do not track bundle sizes.
name: Performance monitor

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/*/src/**'
      - 'packages/*/package.json'
      - 'packages/.helper/**'
      - 'vite.config.ts'
      - 'bun.lock'
      - '.github/workflows/perf-monitor.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Explicit bash runs every step with `-eo pipefail`, so a failing command fails its step even when piped.
defaults:
  run:
    shell: bash

jobs:
  bundle-size:
    name: Monitor bundle sizes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref || github.event.repository.default_branch }}
          path: base
          persist-credentials: false

      - name: Checkout pull request
        uses: actions/checkout@v7
        with:
          path: pr
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ vars.BUN_VERSION || '1.4.3' }}

      - name: Build base branch
        working-directory: base
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build:packages

      - name: Build pull request
        working-directory: pr
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build:packages

      - name: Compare dist sizes
        run: |
          size_of() { if [ -d "$1" ]; then du -sb "$1" | cut -f1; else echo 0; fi; }
          report="$RUNNER_TEMP/bundle-sizes.md"
          base_total=0
          pr_total=0
          {
            echo "## Bundle size analysis"
            echo ""
            echo "| Package | Base (bytes) | PR (bytes) | Change |"
            echo "|---------|-------------:|-----------:|-------:|"
            pkgs=$( (ls -d base/packages/*/ pr/packages/*/ 2>/dev/null || true) | xargs -n1 basename | sort -u)
            for pkg in $pkgs; do
              base=$(size_of "base/packages/$pkg/dist")
              pr=$(size_of "pr/packages/$pkg/dist")
              base_total=$((base_total + base))
              pr_total=$((pr_total + pr))
              echo "| $pkg | $base | $pr | $((pr - base)) |"
            done
            echo "| **Total** | **$base_total** | **$pr_total** | **$((pr_total - base_total))** |"
          } > "$report"
          percent=0
          if [ "$base_total" -gt 0 ]; then
            percent=$(( (pr_total - base_total) * 100 / base_total ))
          fi
          echo "" >> "$report"
          echo "Total change: ${percent}%" >> "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          echo "PERCENT=$percent" >> "$GITHUB_ENV"

      - name: Upload bundle report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: bundle-size-report
          path: ${{ runner.temp }}/bundle-sizes.md
          if-no-files-found: ignore
          retention-days: 30

      - name: Check for size regression
        run: |
          if [ "${PERCENT:-0}" -gt 10 ]; then
            echo "::error::Bundle size increased by more than 10% (${PERCENT}%)"
            exit 1
          fi
          echo "Bundle size change within 10% (${PERCENT:-0}%)."
