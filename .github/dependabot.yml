version: 2
updates:
  # Root and workspace dependencies (bun.lock, text format, Bun >= 1.1.39)
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    # Match bunfig.toml `minimumReleaseAge` (3 days) so Dependabot never proposes versions bun refuses to install.
    cooldown:
      default-days: 3
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    assignees:
      - fsegurai
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      codemirror:
        patterns:
          - "@codemirror/*"
          - "@lezer/*"
        update-types:
          - "minor"
          - "patch"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 3
    labels:
      - "ci-cd"
    open-pull-requests-limit: 5
    assignees:
      - fsegurai
    commit-message:
      prefix: "ci(actions)"
    groups:
      github-actions:
        patterns:
          - "*"
