# actions/labeler v5 configuration. Read from the base branch by .github/workflows/pr_triage.yml.

infra:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/*.yml'
          - '.github/ISSUE_TEMPLATE/**'
          - '.editorconfig'
          - '.gitignore'
          - 'env.example'
          - 'Makefile'
          - 'biome.json'
          - 'bunfig.toml'
          - '.husky/**'
          - 'vite.config.ts'
          - 'vite-env.d.ts'
          - 'tsconfig*.json'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'bun.lock'
          - 'package.json'
          - 'packages/*/package.json'

ci-cd:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
          - 'pipelines/**'

demo:
  - changed-files:
      - any-glob-to-any-file:
          - 'demo/**'

demo-assets:
  - changed-files:
      - any-glob-to-any-file:
          - 'demo/public/**'

