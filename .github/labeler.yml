  - changed-files:
      - any-glob-to-any-file:
          - 'demo/styles/**'

demo-scripts:
  - changed-files:
      - any-glob-to-any-file:
          - 'demo/scripts/**'

styles:
  - changed-files:
      - any-glob-to-any-file:
